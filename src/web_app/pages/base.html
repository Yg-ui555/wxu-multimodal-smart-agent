<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}无锡学院智能助手{% endblock %}</title>
  <link rel="stylesheet" href="/static/nav.css?v=2">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="wxu-nav">
    <a href="/" class="wxu-nav-logo">
      <span class="wxu-nav-logo-mark">W</span>
      <span>无锡学院智能助手</span>
    </a>
    <div class="wxu-nav-links">
      <a href="/" class="wxu-nav-link {% if request.url.path == '/' %}active{% endif %}">首页</a>
      <a href="/schedule" class="wxu-nav-link {% if request.url.path.startswith('/schedule') %}active{% endif %}">课表</a>
      <a href="/campus" class="wxu-nav-link {% if request.url.path.startswith('/campus') %}active{% endif %}">校园生活</a>
      <a href="/upload" class="wxu-nav-link {% if request.url.path.startswith('/upload') %}active{% endif %}">上传中心</a>
    </div>
    <a href="/login" class="wxu-nav-user" id="user-nick-badge">未登录</a>
  </nav>

  <div class="wxu-page">
    {% block content %}{% endblock %}
  </div>

  <script>
    // 显示当前昵称（来自 wxu_nick cookie，已登录）或"未登录"（匿名）
    // 点击跳 /logout 退出 / 跳 /login 登录
    (function() {
      const m = document.cookie.match(/(?:^|;\s*)wxu_nick=([^;]+)/);
      const el = document.getElementById('user-nick-badge');
      if (m) {
        let nick = decodeURIComponent(m[1]);
        if (nick.length > 12) nick = nick.substring(0, 12) + '…';
        el.textContent = nick;
        el.href = '/logout';
        el.title = '点击退出登录';
      } else {
        el.textContent = '未登录';
        el.href = '/login';
        el.title = '点击设置昵称';
      }
    })();
  </script>
  {% block extra_script %}{% endblock %}
</body>
</html>
