{% extends "base.html" %}
{% block title %}上传中心 · 无锡学院智能助手{% endblock %}

{% block content %}
<div class="wxu-page-title">
  <span>上传中心</span>
  <span class="wxu-page-title-en">Upload</span>
</div>

<div class="wxu-card">
  <div class="wxu-card-eyebrow">解析 · 课表</div>
  <div class="wxu-card-title">📅 课表 PDF / 截图</div>
  <input type="file" id="file-schedule" class="wxu-file-input" accept=".pdf,.png,.jpg,.jpeg">
  <div class="wxu-file-hint">
    解析后会保存到 <b style="color:var(--accent-deep);">我的课表</b>,前往 <a href="/schedule">/schedule</a> 查看
  </div>
  <div id="status-schedule" class="wxu-status" style="display:none;"></div>
</div>
{% endblock %}

{% block extra_script %}
<script>
function uploadFile(inputId, statusId, endpoint) {
  const input = document.getElementById(inputId);
  const status = document.getElementById(statusId);
  input.addEventListener('change', async () => {
    if (!input.files.length) return;
    const file = input.files[0];
    status.className = 'wxu-status';
    status.textContent = '⏳ 上传中…';
    status.style.display = 'block';
    try {
      const fd = new FormData();
      fd.append('file', file);
      const resp = await fetch(endpoint, {method: 'POST', body: fd});
      if (!resp.ok) {
        const err = await resp.json();
        throw new Error(err.detail || '上传失败');
      }
      const data = await resp.json();
      status.className = 'wxu-status success';
      if (data.parsed !== undefined) {
        status.textContent = `✅ 解析成功:${data.parsed} 节课(${data.parse_method})`;
      } else {
        status.textContent = '✅ 上传成功:' + JSON.stringify(data);
      }
    } catch (e) {
      status.className = 'wxu-status error';
      status.textContent = '❌ ' + e.message;
    }
  });
}

uploadFile('file-schedule', 'status-schedule', '/api/schedule/upload');
// OCR / YOLO 端点待接入
</script>
{% endblock %}
