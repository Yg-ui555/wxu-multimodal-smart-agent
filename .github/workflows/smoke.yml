# ============================================================
# CI：语法检查 + 单元测试
# ------------------------------------------------------------
# 目的：每次 push / PR 自动跑
#   ① ast 语法检查 —— 防止明显笔误进 main
#   ② pytest 单元测试 —— 让「22 个用例全绿」这句话有 CI 背书
#
# 为什么不跑完整 smoke_test.py？
#   smoke_test.py 要 import torch + paddleocr + sentence_transformers，
#   装这些要 5-10 分钟 + 几 GB 流量，CI 会超时。
#   所以 CI 跑【最小依赖集】（requirements-ci.txt）+ 单元测试，
#   完整 smoke_test 留给本地 rebuild_venv.ps1 后手动跑。
#
# 单元测试不需要 Ollama、不需要 API key —— 见 requirements-ci.txt 的说明。
# ============================================================

name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: 语法检查 (Python ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check all source files
        run: |
          python -c "
          import ast, pathlib, sys
          errs = []
          files = list(pathlib.Path('src').rglob('*.py')) + list(pathlib.Path('scripts').rglob('*.py'))
          for f in files:
              try:
                  ast.parse(open(f, encoding='utf-8').read(), filename=str(f))
              except SyntaxError as e:
                  errs.append((str(f), str(e)))
          if errs:
              for f, e in errs:
                  print(f'{f}: {e}')
              sys.exit(1)
          print(f'All {len(files)} files passed syntax check')
          "

  unit-tests:
    name: 单元测试 (Python ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run pytest
        run: python -m pytest tests/ -q --no-header -p no:cacheprovider

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.os }}
          path: |
            .pytest_cache/
          retention-days: 7
