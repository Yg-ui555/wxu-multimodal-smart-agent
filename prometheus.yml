# ============================================================
# Prometheus 抓取配置
# 指标定义见 src/web_app/monitoring.py（10 个 wxu_* 指标）
# 告警规则见同目录的 prometheus-alerts.yml
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: 'wxu-fastapi'
    metrics_path: /metrics
    static_configs:
      - targets: ['fastapi:7862']
        labels:
          service: 'wxu-smart-agent'
