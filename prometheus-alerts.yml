# ============================================================
# 告警规则（由 prometheus.yml 的 rule_files 加载）
# 阈值是拍的起步值，生产要按自己的 SLO 调 —— 面试时最好这么讲。
# ============================================================
groups:
  - name: wxu_alerts
    rules:
      - alert: HighP99Latency
        expr: histogram_quantile(0.99, rate(wxu_qa_latency_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 延迟超过 10s"

      - alert: HighErrorRate
        expr: rate(wxu_qa_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "错误率超过 10%"

      - alert: LowCacheHitRate
        expr: rate(wxu_cache_hits_total[5m]) / (rate(wxu_cache_hits_total[5m]) + rate(wxu_cache_misses_total[5m])) < 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "缓存命中率低于 30%"

      - alert: ServiceBacklog
        expr: wxu_qa_in_flight > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "在飞请求数持续偏高，可能在积压"
